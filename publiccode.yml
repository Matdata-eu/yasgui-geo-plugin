description:
  en:
    shortDescription: Shows geometries from SPARQL results on a Leaflet map in YASGUI and MatGUI.
    longDescription: |
      This plugin shows the geometries in a SPARQL result directly on a map, so spatial Linked Data can be checked without exporting it to a GIS.

      It renders WKT, GeoJSON, GML, GeoHash and latitude/longitude columns, and reprojects coordinates on the fly. It offers marker clustering, a heatmap, drawing tools that produce a GeoSPARQL filter, a time slider and export to GeoJSON, KML, CSV or PNG. It works in YASGUI and in MatGUI, where it is included by default.
    documentation: https://github.com/Matdata-eu/yasgui-geo-plugin#readme
    features:
    - WKT, GeoJSON, GML, GeoHash and lat/lon rendering
    - On-the-fly reprojection with proj4
    - Marker clustering and heatmap
    - Drawing tools that produce a GeoSPARQL filter
    - Export to GeoJSON, KML, CSV or PNG
